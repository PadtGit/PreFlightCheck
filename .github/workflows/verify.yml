name: Verify PreFlightCheck

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-verification:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned test modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -ErrorAction Stop
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -ErrorAction Stop
          Get-Module -ListAvailable Pester, PSScriptAnalyzer |
            Sort-Object Name, Version -Descending |
            Select-Object -First 4 Name, Version, Path

      - name: Parse PS5.1 files with Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(git ls-files -- '*.ps1' '*.psm1' |
            Where-Object { Select-String -LiteralPath $_ -Pattern '^#Requires -Version 5\.1' -Quiet })
          if ($files.Count -eq 0) { throw 'No PS5.1 files found to parse.' }
          $failed = 0
          foreach ($file in $files) {
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path, [ref]$null, [ref]$parseErrors)
            foreach ($parseError in $parseErrors) {
              $failed++
              Write-Output ('{0}:{1}: {2}' -f $file, $parseError.Extent.StartLineNumber, $parseError.Message)
            }
          }
          Write-Output "Parsed $($files.Count) file(s) with PowerShell $($PSVersionTable.PSVersion)."
          if ($failed -gt 0) { throw "$failed PS5.1 parse error(s)." }

      - name: Run Pester safety tests
        shell: pwsh
        run: |
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputFormat = 'NUnitXml'
          $configuration.TestResult.OutputPath = './test-results.xml'
          # Registry virtualization is not part of this repository's tests and
          # is disabled for compatibility with locked-down runners.
          $configuration.TestRegistry.Enabled = $false
          Invoke-Pester -Configuration $configuration

      - name: Run PSScriptAnalyzer
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          for /L %%A in (1,1,3) do (
            pwsh -NoLogo -NoProfile -File ./tools/Invoke-FullScriptAnalysis.ps1
            set ANALYZER_EXIT=!ERRORLEVEL!
            if !ANALYZER_EXIT! EQU 0 exit /b 0
            echo PSScriptAnalyzer attempt %%A failed with exit code !ANALYZER_EXIT!.
            if %%A LSS 3 timeout /t 5 /nobreak > NUL
          )
          exit /b !ANALYZER_EXIT!

      - name: Upload full analyzer report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psscriptanalyzer-full-review
          path: ValidationReport/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pester-results
          path: test-results.xml
          if-no-files-found: ignore

